[package]
name = "kazuya_training_lab"
version = "0.2.2"
edition = "2021"
build = "build.rs"
license = "MIT"
description = "Experimental offline GameCube EWGF input adapter; not hardware-validated"

[lib]
crate-type = ["cdylib"]

[package.metadata.skyline]
titleid = "01006A800016E000"

[dependencies]
skyline = { git = "https://github.com/ultimate-research/skyline-rs.git" }
smash = { package = "skyline_smash", git = "https://github.com/ultimate-research/skyline-smash.git", features = ["weak_l2cvalue"] }
smashline = { git = "https://github.com/HDR-Development/smashline.git" }

[patch.crates-io]
skyline = { git = "https://github.com/ultimate-research/skyline-rs.git" }

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
