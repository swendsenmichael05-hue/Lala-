name: Kazuya source snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/source-snapshot.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip HEAD -o /tmp/kazuya-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kazuya-source-snapshot
          path: /tmp/kazuya-source.zip
          if-no-files-found: error
          retention-days: 7
