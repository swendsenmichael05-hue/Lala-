# Kazuya Training Lab: cloud compilation of the experimental offline prototype.
# Compilation does not establish compatibility or correct in-game EWGF timing.
name: Kazuya offline training - cloud build
on:
  push:
    paths:
      - '.github/workflows/kazuya-cloud-build.yml'
      - 'Cargo.toml'
      - 'build.rs'
      - 'src/**'
      - 'core/**'
      - 'tools/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kazuya-cloud-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      GIT_TERMINAL_PROMPT: '0'
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Read prototype source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source is present
        run: |
          mkdir -p cloud-logs
          test -f Cargo.toml
          test -f src/lib.rs
          test -f core/ewgf_core.c
          grep -Eq '^enable_macro[[:space:]]*=[[:space:]]*false' config/config.ini
      - name: Install host tools on GitHub
        timeout-minutes: 15
        run: |
          mkdir -p cloud-logs
          exec > >(tee cloud-logs/01-host-tools.log) 2>&1
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang build-essential pkg-config libssl-dev git python3
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
          clang --version
      - name: Test input engine
        timeout-minutes: 5
        run: |
          exec > >(tee cloud-logs/02-input-tests.log) 2>&1
          set -euo pipefail
          bash tools/test_core.sh
          python3 tests/test_staging.py
      - name: Install Skyline compiler helper
        timeout-minutes: 15
        run: |
          exec > >(tee cloud-logs/03-skyline-install.log) 2>&1
          set -euo pipefail
          cargo +stable install cargo-skyline --locked --git https://github.com/jam1garner/cargo-skyline.git --rev 7d45fed93c8a4434bd3d03518fb9f4efcbf88e62
          cargo skyline --version
      - name: Install Switch Rust toolchain
        timeout-minutes: 15
        run: |
          exec > >(tee cloud-logs/04-switch-toolchain.log) 2>&1
          set -euo pipefail
          cargo skyline update-std
          rustup toolchain list
          rustc +skyline-v3 --version
      - name: Compile and stage native plugin
        id: native
        timeout-minutes: 25
        run: |
          exec > >(tee cloud-logs/05-native-build.log) 2>&1
          set -euo pipefail
          rm -rf target dist
          bash tools/build_linux.sh
          test -f dist/BUILD_OK.txt
          test -f dist/SD_ROOT/atmosphere/contents/01006A800016E000/romfs/skyline/plugins/libkazuya_training_lab.nro
          cp README.md dist/README.md
      - name: Record outcome
        if: always()
        run: |
          mkdir -p cloud-logs
          if [ -f Cargo.lock ]; then cp Cargo.lock cloud-logs/Cargo.lock; fi
          if [ -f dist/BUILD_OK.txt ]; then
            echo 'Native NRO produced. NOT Switch-tested. Diagnostics only by default.' | tee cloud-logs/status.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No successful native package produced. Read the failed step and diagnostics artifact.' | tee cloud-logs/status.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Automatic DI routes and Ferps tech are not implemented.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kazuya-build-diagnostics
          path: |
            cloud-logs/
            build.log
            validation/local/*.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Save unverified plugin after successful compilation only
        if: success() && steps.native.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kazuya-training-lab-NRO-unverified
          path: dist/
          if-no-files-found: error
          retention-days: 7
